name: TaskBoard Python DevSecOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Backend Tests & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: final-devops-project/application/backend

      - name: Run Pytest test suite (10 test cases)
        run: |
          pytest -v --tb=short
        working-directory: final-devops-project/application/backend

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build React Frontend
        run: |
          npm ci
          npm run build
        working-directory: final-devops-project/application/frontend

  build-scan-push:
    name: Docker Build, Trivy Security Scan & GHCR Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository owner for image tagging
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build Docker images
        run: |
          docker build -t ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:${{ github.sha }} \
                       -t ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:latest \
                       final-devops-project/application/backend
          docker build -t ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:${{ github.sha }} \
                       -t ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:latest \
                       final-devops-project/application/frontend

      - name: Install Trivy Security Scanner
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Download Trivy Vulnerability Database
        run: |
          for repo in "ghcr.io/aquasecurity/trivy-db:2" "public.ecr.aws/aquasecurity/trivy-db:2"; do
            echo "Attempting to download Trivy vulnerability database from $repo..."
            if trivy image --download-db-only --db-repository "$repo"; then
              echo "Successfully downloaded Trivy database from $repo"
              exit 0
            fi
            echo "Failed from $repo, trying next mirror..."
          done
          echo "Attempting default Trivy DB mirror..."
          trivy image --download-db-only

      - name: Trivy Vulnerability Scan - Backend Image
        run: |
          trivy image --skip-db-update \
            --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore --format table \
            --output backend-scan.txt \
            ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:${{ github.sha }}
          cat backend-scan.txt

      - name: Trivy Vulnerability Scan - Frontend Image
        run: |
          trivy image --skip-db-update \
            --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore --format table \
            --output frontend-scan.txt \
            ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:${{ github.sha }}
          cat frontend-scan.txt

      - name: Publish Security Scan Summaries
        if: always()
        run: |
          {
            echo "## DevSecOps Trivy Security Gate Report"
            echo ""
            if [ -f backend-scan.txt ]; then
              echo "### Backend Scan Report"
              echo '```'
              cat backend-scan.txt
              echo '```'
            fi
            if [ -f frontend-scan.txt ]; then
              echo "### Frontend Scan Report"
              echo '```'
              cat frontend-scan.txt
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload Security Scan Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports
          path: |
            backend-scan.txt
            frontend-scan.txt
          if-no-files-found: ignore

      - name: Enforce Security Gate (Fail on HIGH or CRITICAL)
        run: |
          echo "Enforcing Trivy security gate (exit-code 1 on HIGH or CRITICAL findings)..."
          trivy image --skip-db-update \
            --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore --exit-code 1 \
            ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:${{ github.sha }}
          trivy image --skip-db-update \
            --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore --exit-code 1 \
            ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:${{ github.sha }}

      - name: Push Docker Images to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Publishing container images to GHCR..."
          docker push ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:${{ github.sha }} || (sleep 3 && docker push ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:${{ github.sha }})
          docker push ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:latest || (sleep 3 && docker push ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:latest)
          docker push ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:${{ github.sha }} || (sleep 3 && docker push ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:${{ github.sha }})
          docker push ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:latest || (sleep 3 && docker push ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:latest)

  k8s-validate-and-deploy:
    name: Helm Chart Validation & Kubernetes Deployment
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Downcase repository owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Helm Lint Chart
        run: |
          helm lint final-devops-project/helm/taskboard

      - name: Helm Template Validation (Dry Run)
        run: |
          helm template taskboard final-devops-project/helm/taskboard \
            --set backend.image=ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend \
            --set backend.tag=${{ github.sha }} \
            --set frontend.image=ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend \
            --set frontend.tag=${{ github.sha }} \
            --set ingress.enabled=true

      - name: Deploy to Remote Kubernetes Cluster
        if: github.ref == 'refs/heads/main'
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "::notice ::KUBE_CONFIG_DATA secret not configured in GitHub repository secrets. Helm template validated successfully. Skipping remote cluster deployment."
            exit 0
          fi
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          helm upgrade --install taskboard ./final-devops-project/helm/taskboard -n taskboard --create-namespace \
            --set backend.image=ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend \
            --set backend.tag=${{ github.sha }} \
            --set frontend.image=ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend \
            --set frontend.tag=${{ github.sha }} \
            --set ingress.enabled=true
