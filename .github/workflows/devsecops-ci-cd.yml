name: TaskBoard Python DevSecOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Backend Tests & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: final-devops-project/application/backend

      - name: Run Pytest test suite (10 test cases)
        run: |
          pytest -v --tb=short
        working-directory: final-devops-project/application/backend

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build React Frontend
        run: |
          npm ci || npm install
          npm run build
        working-directory: final-devops-project/application/frontend

  build-scan-push:
    name: Docker Build, Trivy Security Scan & GHCR Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository owner for image tagging
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build Docker images
        run: |
          docker build -t ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:${{ github.sha }} \
                       -t ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:latest \
                       final-devops-project/application/backend
          docker build -t ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:${{ github.sha }} \
                       -t ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:latest \
                       final-devops-project/application/frontend

      - name: Install Trivy Security Scanner
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Trivy Vulnerability Scan - Backend Image
        run: |
          trivy image --db-repository public.ecr.aws/aquasecurity/trivy-db:2 \
            --severity HIGH,CRITICAL --ignore-unfixed --format table \
            --output backend-scan.txt \
            ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:${{ github.sha }}
          cat backend-scan.txt
          trivy image --db-repository public.ecr.aws/aquasecurity/trivy-db:2 \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:${{ github.sha }}

      - name: Trivy Vulnerability Scan - Frontend Image
        run: |
          trivy image --db-repository public.ecr.aws/aquasecurity/trivy-db:2 \
            --severity HIGH,CRITICAL --ignore-unfixed --format table \
            --output frontend-scan.txt \
            ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:${{ github.sha }}
          cat frontend-scan.txt
          trivy image --db-repository public.ecr.aws/aquasecurity/trivy-db:2 \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:${{ github.sha }}

      - name: Push Docker Images to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:latest
          docker push ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:latest

  k8s-validate-and-deploy:
    name: Helm Chart Validation & Kubernetes Deployment
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Downcase repository owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Helm Lint Chart
        run: |
          helm lint final-devops-project/helm/taskboard

      - name: Helm Template Validation (Dry Run)
        run: |
          helm template taskboard final-devops-project/helm/taskboard \
            --set backend.image=ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend \
            --set backend.tag=${{ github.sha }} \
            --set frontend.image=ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend \
            --set frontend.tag=${{ github.sha }} \
            --set ingress.enabled=true

      - name: Deploy to Remote Kubernetes Cluster
        if: github.ref == 'refs/heads/main'
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "::notice ::KUBE_CONFIG_DATA secret not configured in GitHub repository secrets. Helm template validated successfully. Skipping remote cluster deployment."
            exit 0
          fi
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          helm upgrade --install taskboard ./final-devops-project/helm/taskboard -n taskboard --create-namespace \
            --set backend.image=ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend \
            --set backend.tag=${{ github.sha }} \
            --set frontend.image=ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend \
            --set frontend.tag=${{ github.sha }} \
            --set ingress.enabled=true
