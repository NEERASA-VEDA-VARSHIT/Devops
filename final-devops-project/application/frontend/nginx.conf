server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA client-side routing: serve index.html for all non-file routes
  location / {
    try_files $uri /index.html;
  }

  # Architecture Routing Note:
  # 1. In Docker Compose (local development):
  #    Nginx reverse-proxies /api/ and /health directly to the container 'http://backend:8000'.
  # 2. In Kubernetes (production / cluster deployment):
  #    The Kubernetes Ingress controller (see helm/taskboard/templates/ingress.yaml)
  #    routes path '/api' directly to the backend Service (port 8000) and path '/'
  #    to this frontend Service (port 80).
  #    This proxy block provides backward compatibility for local compose and direct Service port-forwards.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health {
    proxy_pass http://backend:8000/health;
  }
}
