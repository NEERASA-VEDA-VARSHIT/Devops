apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskboard-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/NEERASA-VEDA-VARSHIT/Devops.git
    targetRevision: main
    path: final-devops-project/helm/taskboard
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: taskboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
