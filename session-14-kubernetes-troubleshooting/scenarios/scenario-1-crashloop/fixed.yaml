apiVersion: v1
kind: Pod
metadata:
  name: fail-1-crashloop-pod
  labels:
    tier: triage-gauntlet
    scenario: crashloop
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      env:
        - name: DATABASE_URL
          value: "postgres://user:password@postgres-service:5432/appdb"
      command:
        - "python3"
        - "-c"
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully with DB:", db_url)
          while True:
              time.sleep(3600)
