apiVersion: v1
kind: Pod
metadata:
  name: fail-5-oomkilled-pod
  labels:
    tier: triage-gauntlet
    scenario: oomkilled
spec:
  containers:
    - name: memory-leaker
      image: python:3.11-alpine
      command:
        - "python3"
        - "-c"
        - |
          import time
          print("Allocating controlled memory within limits...")
          # FIX: Controlled memory usage that stays well within 256Mi threshold
          data = b"x" * (10 * 1024 * 1024) # 10MB allocated
          print("Memory allocation successful. Application running stably.")
          while True:
              time.sleep(3600)
      resources:
        requests:
          memory: "64Mi"
        limits:
          # FIX: Adequate memory headroom to prevent Linux OOM Killer invocation
          memory: "256Mi"
